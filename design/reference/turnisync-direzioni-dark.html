@keyframes ts-page-in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

</style>
<script>
(()=>{
 const root=document.getElementById('turnisync-dark-studio');
 const shifts=[
  {code:'MAT',name:'Mattina',start:'06:00',end:'14:00',hours:8,color:'#F5CF7C',tone:'#493A22',shape:'40% 40% 40% 40% / 38% 38% 38% 38%'},
  {code:'POM',name:'Pomeriggio',start:'14:00',end:'22:00',hours:8,color:'#F7A8B8',tone:'#492C38',shape:'45% 36% 43% 35% / 34% 46% 35% 45%'},
  {code:'NOT',name:'Notte',start:'22:00',end:'06:00',hours:8,color:'#BDB0F5',tone:'#37304B',shape:'28% 45% 28% 45%'},
  {code:'SMO',name:'Smonto',start:'—',end:'',hours:0,color:'#8AD9C0',tone:'#203F36',shape:'43% 30% 40% 30%'},
  {code:'RIP',name:'Riposo',start:'—',end:'',hours:0,color:'#B8C6D0',tone:'#303B43',shape:'50%'},
  {code:'FER',name:'Ferie',start:'—',end:'',hours:0,color:'#9BCBEE',tone:'#263D4C',shape:'28% 28% 45% 45%'}
 ];
 const names=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
 const icon=(name,extra='')=>`<i data-lucide="${name}" aria-hidden="true" class="${extra}"></i>`;
 const btn=(action,label,content,cls='',data='')=>`<button type="button" data-action="${action}" aria-label="${label}" class="cursor-interaction ${cls}" ${data}>${content}</button>`;
 const shiftStyle=s=>`--shift:${s.color};--tone:${s.tone};--shape:${s.shape}`;
 const cycle=[0,0,1,1,2,3,4];
 const sample=Array.from({length:42},(_,i)=>{
   const date=new Date(2026,9,26+i);let ids=[cycle[(i+2)%7]];
   if(date.getMonth()===10 && [6,7,8].includes(date.getDate()))ids=[5];
   if(date.getMonth()===10 && date.getDate()===9)ids=[1];
   if(date.getMonth()===10 && date.getDate()===11)ids=[0,1];
   return {date,ids,onCall:[6,14,15,28].includes(i),note:i===14,overtime:i===14,trip:i===19,holiday:i===6};
 });
 const visible=sample.filter(d=>d.date.getMonth()===10);
 const counts=shifts.map((s,id)=>({id,count:visible.reduce((n,d)=>n+d.ids.filter(v=>v===id).length,0)}));
 const totalHours=visible.reduce((n,d)=>n+d.ids.reduce((v,id)=>v+shifts[id].hours,0)+(d.overtime?1:0),0);
 const totalShifts=counts.reduce((s,m)=>s+m.count,0);
 const workingDays=visible.filter(d=>d.ids.some(id=>shifts[id].hours>0)).length;
 const states=new Map();
 const savedState=window.openai?.widgetState;
 const savedDesigns=(savedState?.modelContent??savedState)?.designs??[];
 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:21,height:21}})}
 function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{designs:[...states].map(([key,s])=>({design:key,screen:s.screen,theme:s.light?'Chiaro':'Scuro'}))},privateContent:{}}).catch(()=>{})}
 function dayHTML(d,i,s){let number=d.date.getDate();const outside=d.date.getMonth()!==10;return btn('day',`${number} ${outside?'altro mese':'novembre'}, ${d.ids.map(id=>shifts[id].name).join(', ')}${d.onCall?', reperibilità':''}${d.note?', nota':''}`,`<div class="ts-date-row">${d.note?icon('message-square','ts-marker ts-note-marker'):''}<span class="ts-date">${number}</span>${d.onCall?icon('bell','ts-marker'):''}</div>${d.ids.map(id=>`<span class="ts-shift" style="${shiftStyle(shifts[id])}"><strong>${shifts[id].code}</strong><span>${shifts[id].start}</span></span>`).join('')}${d.overtime?'<span class="ts-extra-line">+ 1 h</span>':d.trip?`<span class="ts-extra-line">${icon('plane')} trasf.</span>`:''}`,`ts-day ${outside?'outside':''} ${i%7>4?'weekend':''} ${i===10?'today':''} ${s.selected===i?'selected':''} ${d.holiday?'holiday':''} ${d.onCall?'on-call':''} ${d.ids.length>1?'double':''}`,`data-index="${i}"`)}
 function header(title){return `<header class="ts-header"><h1 class="ts-page-title">${title}</h1>${btn('settings','Impostazioni',icon('settings-2'),'ts-icon-btn ts-gear')}</header>`}
 function calendar(s){return `<header class="ts-header"><div class="ts-month">${btn('prev','Mese precedente',icon('chevron-left'),'ts-icon-btn')}<strong>Novembre<span class="ts-year">2026</span></strong>${btn('next','Mese successivo',icon('chevron-right'),'ts-icon-btn')}</div>${btn('job','Seleziona lavoro',icon('briefcase-business')+'<span>Studio</span>','ts-job')}${btn('settings','Impostazioni',icon('settings-2'),'ts-icon-btn ts-gear')}</header><div class="ts-calendar"><div class="ts-weekdays">${['L','M','M','G','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div><div class="ts-days">${sample.map((d,i)=>dayHTML(d,i,s)).join('')}</div></div><div class="ts-month-foot"><span>Novembre in sintesi</span><span><strong>${totalHours} h</strong> · ${workingDays} giorni</span></div>`}
 function ring(s){let accumulated=48;const distribution=counts.filter(m=>m.count);const darker=s.design==='ember'||(s.light&&s.design==='carbon');const inks=['#A3751D','#B5506B','#7D63BB','#347C66','#627887','#427BA4'];return `<svg class="ts-ring" viewBox="0 0 180 180" role="img" aria-label="Ripartizione dei ${totalShifts} turni del mese sulla parte visibile dell’arco">${distribution.map((m,i)=>{const a=i===0?38:accumulated+.6;accumulated+=m.count/totalShifts*184;const b=i===distribution.length-1?244:accumulated-.6;const point=deg=>[90+68*Math.cos(deg*Math.PI/180),90+68*Math.sin(deg*Math.PI/180)].join(' ');return `<path class="ts-arc" pathLength="1" d="M ${point(a)} A 68 68 0 ${b-a>180?1:0} 1 ${point(b)}" stroke="${darker?inks[m.id]:shifts[m.id].color}" style="animation-delay:${i*60}ms"/>`}).join('')}</svg>`}
 function statistics(s){return `${header('Statistiche')}<div class="ts-segments">${['Mese','Anno','Personalizzato'].map(p=>btn('period',p,p,p===s.period?'active':'',`data-period="${p}"`)).join('')}</div><div class="ts-period">${btn('prev','Periodo precedente',icon('chevron-left'),'ts-icon-btn')}<span>${s.period==='Anno'?'2026':s.period==='Personalizzato'?'1 – 30 novembre':'Novembre'}${s.period==='Mese'?'<small>2026</small>':''}</span>${btn('next','Periodo successivo',icon('chevron-right'),'ts-icon-btn')}</div><section class="ts-hero"><div class="ts-eyebrow">Resoconto totale</div>${ring(s)}<div class="ts-total">${s.period==='Anno'?totalHours*10:totalHours}<small>h</small></div><div class="ts-total-caption">ore lavorate · include 1 h extra</div><div class="ts-hero-bottom"><span><strong>${s.period==='Anno'?workingDays*10:workingDays}</strong> giorni</span><span><strong>${s.period==='Anno'?totalShifts*10:totalShifts}</strong> turni</span></div></section><div class="ts-section-heading">I tuoi turni<small>nel periodo</small></div><div class="ts-metrics">${counts.map(m=>{const sh=shifts[m.id];const count=s.period==='Anno'?m.count*10:m.count;return `<article class="ts-metric" style="${shiftStyle(sh)}"><h3>${sh.name}</h3><strong>${count}</strong><small>${sh.hours?count*sh.hours+' ore':'giorni'}</small></article>`}).join('')}</div><div class="ts-work-card"><div class="ts-work-title">${icon('briefcase-business')}Studio</div><div class="ts-work-values"><span><strong>${totalHours} h</strong>lavorate</span><span><strong>${totalShifts}</strong>turni</span><span><strong>1 h</strong>straordinario</span></div></div>`}
 function settings(s){const groups=[['Il tuo calendario',[['palette','Aspetto e colori','Tema e personalizzazione','theme'],['bell','Reperibilità','Turni e regole del lavoro','preview'],['alarm-clock','Sveglie','Regole e prossimi avvisi','preview']]],['Strumenti',[['chart-no-axes-combined','Conteggio statistiche','Scegli cosa includere nei totali','preview'],['file-down','Esporta e stampa PDF','Calendario, elenco e anno','preview'],['sparkles','Importazione con AI','Rivedi e importa i tuoi turni','preview']]],['I tuoi dati',[['cloud-check','Backup e sincronizzazione','Account e salvataggi','preview']]]];return `<header class="ts-header">${btn('calendar','Torna al calendario',icon('arrow-left'),'ts-icon-btn')}<h1 class="ts-page-title" style="flex:1;margin-left:8px">Impostazioni</h1></header>${groups.map(([title,rows])=>`<div class="ts-section-heading" style="margin-top:17px">${title}</div><div class="ts-setting-group">${rows.map(([ic,label,caption,action])=>btn(action,label,`<span class="ts-setting-icon">${icon(ic)}</span><span class="ts-setting-copy">${label}<small>${caption}</small></span>${icon('chevron-right')}`)).join('')}</div>`).join('')}`}
 function catalog(){return `<header class="ts-header">${btn('calendar','Torna al calendario',icon('arrow-left'),'ts-icon-btn')}<h1 class="ts-page-title" style="flex:1;margin-left:8px">Turni e lavori</h1>${btn('preview','Nuovo turno',icon('plus'),'ts-icon-btn')}</header><div class="ts-segments"><button class="active" type="button">Modelli</button>${btn('preview','Rotazioni','Rotazioni')}${btn('preview','Lavori','Lavori')}</div>${shifts.map(s=>`<div class="ts-catalog-item"><span class="ts-detail-badge" style="${shiftStyle(s)}">${s.code}</span><div class="ts-detail-copy">${s.name}<small>${s.hours?s.start+' – '+s.end:'Tutto il giorno'}</small></div>${btn('preview','Modifica '+s.name,icon('pencil'),'ts-icon-btn')}</div>`).join('')}`}
 function dock(s){if(s.edit)return '';return `<nav class="ts-dock" aria-label="Navigazione principale">${s.screen==='calendar'?btn('edit','Modifica i turni',icon('pencil'),'ts-orbit'):''}<div class="ts-tabs">${btn('calendar','Calendario',icon('calendar-days')+'<span class="ts-tab-label">Calendario</span>','ts-tab '+(s.screen==='calendar'?'active':''),`aria-pressed="${s.screen==='calendar'}"`)}${btn('stats','Statistiche',icon('chart-no-axes-combined')+'<span class="ts-tab-label">Statistiche</span>','ts-tab '+(s.screen==='stats'?'active':''),`aria-pressed="${s.screen==='stats'}"`)}</div>${s.screen==='calendar'?btn('catalog','Turni e lavori',icon('clock-3'),'ts-orbit'):''}</nav>`}
 function sheet(s){if(s.selected===null)return '';const d=sample[s.selected];return `<section class="ts-sheet" aria-label="Dettaglio del giorno"><div class="ts-sheet-header"><span>${names[d.date.getDay()]} ${d.date.getDate()} novembre</span>${btn('close','Chiudi dettaglio',icon('x'))}</div>${d.holiday?`<div class="ts-detail-extra" style="color:var(--danger);margin:0 0 11px">${icon('calendar-heart')} Ognissanti</div>`:''}${d.ids.map(id=>{const sh=shifts[id];return `<div class="ts-detail-row"><span class="ts-detail-badge" style="${shiftStyle(sh)}">${sh.code}</span><div class="ts-detail-copy">${sh.name}<small>${sh.hours?sh.start+' – '+sh.end:'Tutto il giorno'}</small></div><div class="ts-detail-actions">${btn('preview','Impostazioni turno',icon('settings-2'),'ts-icon-btn')}${btn('preview','Trasferta',icon('plane'),'ts-icon-btn')}</div></div>`}).join('')}${d.overtime?`<div class="ts-detail-extra">${icon('clock-3')} Straordinario + 1 h · uscita alle 23:00</div>`:''}${d.note?`<div class="ts-detail-extra note">${icon('message-square')}Ricordati il passaggio di consegne.</div>`:''}${d.onCall?`<div class="ts-detail-extra call">${icon('bell')} Reperibilità attiva</div>`:''}${d.trip?`<div class="ts-detail-extra" style="color:var(--mint)">${icon('plane')}Trasferta</div>`:''}<div class="ts-sheet-footer">${btn('edit','Cambia turno',icon('arrow-left-right')+'Cambia turno')}${btn('preview','Aggiungi turno',icon('plus')+'Aggiungi','primary')}</div></section>`}
 function editSheet(s){return `<section class="ts-sheet ts-edit-sheet" aria-label="Modifica turni"><div class="ts-sheet-header"><span>Modifica turni</span><div class="ts-edit-tools">${btn('preview','Annulla',icon('undo-2'))}${btn('erase','Gomma',icon('eraser'),s.erase?'active':'')}${btn('bell','Reperibilità',icon('bell'),s.bell?'active':'')}${btn('close-edit','Chiudi modifica',icon('x'))}</div></div><div class="ts-edit-modes">${[['Cambia','arrow-left-right'],['Più turni','layers-2'],['Rotazioni','repeat-2']].map(([name,ic])=>btn('mode',name,icon(ic)+name,s.mode===name?'active':'',`data-mode="${name}"`)).join('')}</div><div class="ts-brushes">${shifts.map((sh,i)=>btn('brush',sh.name,sh.code,`ts-brush ${s.brush===i?'active':''}`,`data-brush="${i}" style="${shiftStyle(sh)}"`)).join('')}</div></section>`}
 function render(phone,animate=true){const s=states.get(phone.dataset.design);phone.dataset.light=String(s.light);phone.classList.toggle('editing',s.edit);phone.innerHTML=`<div class="ts-status"><span>9:41</span><div class="ts-system">${icon('signal')}${icon('wifi')}${icon('battery-full')}</div></div><main class="ts-body"><div class="${animate?'ts-enter':''}">${s.screen==='stats'?statistics(s):s.screen==='settings'?settings(s):s.screen==='catalog'?catalog():calendar(s)}</div></main>${dock(s)}<div class="ts-overlay">${s.edit?editSheet(s):sheet(s)}</div><div class="ts-home-indicator"></div>`;icons();const entering=phone.querySelector('.ts-enter');entering?.addEventListener('animationend',event=>{if(event.target===entering)entering.classList.remove('ts-enter')})}
 function notice(phone,text){phone.querySelector('.ts-notice')?.remove();const n=document.createElement('div');n.className='ts-notice';n.textContent=text;phone.append(n);setTimeout(()=>n.remove(),2100)}
 root.querySelectorAll('.ts-phone').forEach(phone=>{const key=phone.dataset.design;const saved=savedDesigns.find(d=>d.design===key);const s={design:key,screen:['calendar','stats','settings','catalog'].includes(saved?.screen)?saved.screen:'calendar',light:saved?.theme==='Chiaro',selected:null,edit:false,mode:'Cambia',brush:1,erase:false,bell:false,period:'Mese'};states.set(key,s);render(phone,false);
  phone.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action;
   if(['calendar','stats','settings','catalog'].includes(action)){s.screen=action;s.selected=null;s.edit=false;render(phone);remember();return}
   if(action==='day'){if(s.edit){phone.querySelectorAll('.ts-day.selected').forEach(el=>el.classList.remove('selected'));button.classList.add('selected');notice(phone,s.erase?'Anteprima della gomma':s.bell?'Anteprima della reperibilità':'Anteprima di '+shifts[s.brush].name);return}s.selected=Number(button.dataset.index);phone.querySelectorAll('.ts-day.selected').forEach(el=>el.classList.remove('selected'));button.classList.add('selected');phone.querySelector('.ts-overlay').innerHTML=sheet(s);icons();return}
   if(action==='close'){s.selected=null;const el=phone.querySelector('.ts-sheet');el?.classList.add('closing');setTimeout(()=>{el?.remove();phone.querySelectorAll('.ts-day.selected').forEach(d=>d.classList.remove('selected'))},190);return}
   if(action==='edit'||action==='close-edit'){s.screen='calendar';s.edit=action==='edit';s.selected=null;render(phone);remember();return}
   if(action==='mode'){s.mode=button.dataset.mode;phone.querySelector('.ts-overlay').innerHTML=editSheet(s);icons();phone.querySelector('.ts-edit-modes .active svg')?.classList.add('ts-icon-pulse');return}
   if(action==='brush'){s.brush=Number(button.dataset.brush);s.erase=false;phone.querySelector('.ts-overlay').innerHTML=editSheet(s);icons();return}
   if(action==='erase'||action==='bell'){s[action==='erase'?'erase':'bell']=!s[action==='erase'?'erase':'bell'];button.classList.toggle('active');button.querySelector('svg')?.classList.add('ts-icon-pulse');return}
   if(action==='period'){s.period=button.dataset.period;render(phone);return}
