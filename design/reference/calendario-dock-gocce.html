<script>
(() => {
  const root = document.getElementById('turni-liquid-v2');
  const phone = root.querySelector('.ct-phone');
  const content = root.querySelector('.ct-content');
  const layer = root.querySelector('.ct-sheet-layer');
  const dock = root.querySelector('.ct-dock');
  const canvas = root.querySelector('.ct-liquid');
  const context = canvas.getContext('2d');
  const buttons = [...dock.querySelectorAll('[data-dock]')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const saved = window.openai?.widgetState;
  const design = { dark: saved?.privateContent?.dark !== false, speed: 1 };
  const state = { tab:'calendar', year:2026, month:9, day:19, sheet:null, mode:'Cambia', paint:'POM', modelTab:'Turni', reportTab:'Mese', onCall:false, travel:false, note:'', overtime:0, selectedShift:'NOT', edits:{} };
  let expansion = 1, velocity = 0, goal = 1, selection = .5, selectionGoal = .5;
  let lastTime = 0, animationId = 0, notificationTimer = 0;
  const definitions = {
    MAT:{name:'Mattina',time:'06:00',range:'06:00 – 13:36',color:'m'},
    POM:{name:'Pomeriggio',time:'14:00',range:'14:00 – 21:36',color:'p'},
    NOT:{name:'Notte',time:'22:00',range:'22:00 – 05:36',color:'n'},
    SMO:{name:'Smonto notte',time:'TG',range:'Tutto il giorno',color:'sm'},
    RIP:{name:'Riposo',time:'TG',range:'Tutto il giorno',color:'rip'},
    FER:{name:'Ferie',time:'TG',range:'Tutto il giorno',color:'fer'},
    GIO:{name:'Giornaliero',time:'08:30',range:'08:30 – 17:06',color:'sm'},
    DOM:{name:'Mat Dom',time:'08:36',range:'08:36 – 16:12',color:'m'}
  };
  const monthShifts = ['POM','POM','NOT','NOT','SMO','RIP','MAT','MAT','NOT','SMO','RIP','POM','POM','NOT','SMO','GIO','MAT','RIP','NOT','NOT','SMO','RIP','MAT','POM','DOM','MAT','MAT','POM','POM','FER','FER'];
  const icons = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const iconButton = (action, label, icon, extra='') => `<button type="button" class="ct-icon cursor-interaction ${extra}" data-action="${action}" aria-label="${label}">${icons(icon)}</button>`;
  const today = new Date(2026,9,19);
  const monthDate = () => new Date(state.year,state.month,1);
  const monthLabel = () => monthDate().toLocaleDateString('it-IT',{month:'long'}).replace(/^./, x=>x.toUpperCase());
  const selectedDate = () => new Date(state.year,state.month,state.day);
  const dateLabel = () => selectedDate().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,x=>x.toUpperCase());
  const shiftFor = day => state.edits[day] || monthShifts[(day-1)%31] || 'MAT';
  const persist = () => window.openai?.setWidgetState?.({modelContent:{concept:'Dock Cattura7 con tre destinazioni e due satelliti',section:state.tab,popup:state.sheet},privateContent:{dark:design.dark}})?.catch(()=>{});
  const refreshIcons = () => { if(globalThis.lucide) lucide.createIcons({attrs:{width:20,height:20}}); };
  function drawBridge(a,b,kind){
    const distance=b.x-a.x;
    if(distance <= Math.abs(a.r-b.r)+1 || a.r<1 || b.r<1) return;
    const theta=Math.PI*.25;
    const xa=a.x+a.r*Math.cos(theta), xb=b.x-b.r*Math.cos(theta);
    const ya=50-a.r*Math.sin(theta), yb=50-b.r*Math.sin(theta);
    const handle=Math.max(3,(xb-xa)*.5);
    const dip=kind==='main'?8:Math.max(1,12*Math.min(1,distance/65));
    context.beginPath();context.moveTo(xa,ya);
    context.bezierCurveTo(xa+handle,ya+dip,xb-handle,yb+dip,xb,yb);
    context.lineTo(xb,100-yb);
    context.bezierCurveTo(xb-handle,100-yb-dip,xa+handle,100-ya-dip,xa,100-ya);
    context.closePath();context.fill();
  }
  function drawDock(){
    const width=dock.clientWidth;
    if(!width) return;
    const dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(width*dpr)||canvas.height!==Math.round(100*dpr)){canvas.width=Math.round(width*dpr);canvas.height=Math.round(100*dpr);}
    context.setTransform(dpr,0,0,dpr,0,0);context.clearRect(0,0,width,100);
    const scale=Math.min(1,width/380);
    const progress=Math.max(0,Math.min(1.12,expansion));
    const r=32*scale;
    const main=[{x:width*.3,r},{x:width*.5,r:36*scale},{x:width*.7,r}];
    const left={x:width*(.3-.218*progress),r:(11+15*progress)*scale};
    const right={x:width*(.7+.218*progress),r:left.r};
    const colors=getComputedStyle(phone);
    context.fillStyle=colors.getPropertyValue('--ct-cream').trim();
    for(const item of main){context.beginPath();context.arc(item.x,50,item.r,0,Math.PI*2);context.fill();}
    drawBridge(main[0],main[1],'main');drawBridge(main[1],main[2],'main');
    if(progress>.01){for(const satellite of [left,right]){context.beginPath();context.arc(satellite.x,50,satellite.r,0,Math.PI*2);context.fill();}drawBridge(left,main[0],'side');drawBridge(main[2],right,'side');}
    context.fillStyle=colors.getPropertyValue('--ct-purple').trim();
    context.beginPath();context.arc(width*selection,50,30*scale,0,Math.PI*2);context.fill();
    const positions={edit:left.x,settings:main[0].x,calendar:main[1].x,report:main[2].x,models:right.x};
    for(const button of buttons){const key=button.dataset.dock;button.style.left=positions[key]+'px';if(key==='edit'||key==='models'){const alpha=Math.max(0,Math.min(1,(progress-.18)/.65));button.style.opacity=alpha;button.style.scale=String(.7+.3*Math.min(progress,1));button.style.visibility=progress<.04?'hidden':'visible';}}
  }
  function tick(time){
    const dt=Math.min(.032,(time-lastTime)/1000||.016)*design.speed;lastTime=time;
    if(reduced.matches){expansion=goal;velocity=0;selection=selectionGoal;}
    else {const acceleration=(goal-expansion)*190-velocity*21;velocity+=acceleration*dt;expansion+=velocity*dt;selection+=(selectionGoal-selection)*Math.min(1,dt*15);}
    drawDock();
    if(Math.abs(expansion-goal)>.0005||Math.abs(velocity)>.001||Math.abs(selection-selectionGoal)>.0005) animationId=requestAnimationFrame(tick);
    else {expansion=goal;selection=selectionGoal;animationId=0;drawDock();}
  }
  function updateDock(){
    goal=state.tab==='calendar'?1:0;
    selectionGoal=state.tab==='settings'?.3:state.tab==='report'?.7:.5;
    dock.hidden=state.tab==='models'||state.sheet==='paint'||['details','notes','replace','add','settings-detail'].includes(state.sheet);
    for(const button of buttons){const key=button.dataset.dock;const satellite=key==='edit'||key==='models';button.disabled=satellite&&goal===0;button.inert=satellite&&goal===0;button.setAttribute('aria-hidden',String(satellite&&goal===0));if(key===state.tab)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');}
    if(!animationId){lastTime=0;animationId=requestAnimationFrame(tick);}
  }
  function calendar(){
    const firstDay=(monthDate().getDay()+6)%7;
    const count=new Date(state.year,state.month+1,0).getDate();
    const total=Math.ceil((firstDay+count)/7)*7;
    let days='';
    for(let index=0;index<total;index++){
      const date=new Date(state.year,state.month,index-firstDay+1);const day=date.getDate();const own=date.getMonth()===state.month;
      const code=own?shiftFor(day):['MAT','MAT','POM'][index%3];const def=definitions[code];
      const isToday=date.getTime()===today.getTime();
      const isSelected=own&&state.sheet==='day'&&state.day===day;
      const secondary=own&&day===15?`<span class="ct-shift" style="--shift:var(--ct-n)">NOT</span>`:'';
      const extra=own&&[16,30,31].includes(day)?`<span class="ct-ex">ex ${day===16?'SMO':day===30?'RIP':'MAT'}</span>`:'';
      days+=`<button type="button" class="ct-day cursor-interaction ${own?'':'ct-out'} ${isToday?'ct-today':''} ${isSelected?'ct-selected':''}" data-day="${day}" ${own?'':'disabled'} aria-label="${escape(date.toLocaleDateString('it-IT',{day:'numeric',month:'long'}))}, ${def.name}, ${def.range}"><span class="ct-daynum">${day}</span>${own&&[1,2,12,13,24,28,29].includes(day)?'<span class="ct-oncall" aria-label="Reperibilità"></span>':''}<span class="ct-shift" style="--shift:var(--ct-${def.color})">${code}</span><span class="ct-time">${def.time}</span>${secondary}${extra}</button>`;
    }
    return `<div class="ct-header"><h2>${monthLabel()}<span class="ct-year">${state.year}</span></h2>${iconButton('today','Vai a oggi','calendar-check')}</div><div class="ct-monthbar"><div class="ct-profile">${icons('briefcase-business')}<span>Lavoro Principale · Turno A</span></div><div class="ct-montharrows">${iconButton('month-prev','Mese precedente','chevron-left')}${iconButton('month-next','Mese successivo','chevron-right')}</div></div><div class="ct-weekdays" aria-hidden="true">${['L','M','M','G','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div><div class="ct-grid ${total===42?'ct-six':''}">${days}</div><div class="ct-legend"><span><span class="ct-dot"></span>Reperibilità</span><span>ex · turno originario</span></div>`;
  }
  function report(){return `<div class="ct-header"><h2>Report</h2><small>Lavoro Principale</small></div><div class="ct-tabs">${['Mese','Anno','Personalizzato'].map(t=>`<button type="button" data-report="${t}" aria-pressed="${state.reportTab===t}">${t}</button>`).join('')}</div><div class="ct-monthbar">${iconButton('report-prev','Periodo precedente','chevron-left')}<strong>${state.reportTab==='Anno'?'2026':state.reportTab==='Personalizzato'?'1 – 31 ottobre 2026':'Ottobre 2026'}</strong>${iconButton('report-next','Periodo successivo','chevron-right')}</div><div class="ct-report-hero"><small>ORE LAVORATE · OTTOBRE</small><div class="ct-total">167,2 <span>h</span></div><p>22 turni di servizio</p><div class="ct-bar" aria-label="Distribuzione dei turni del mese">${[['p',23],['m',19],['n',23],['sm',12],['rip',16],['fer',7]].map(([c,w])=>`<span style="background:var(--ct-${c});width:${w}%"></span>`).join('')}</div><small>Mattina · Pomeriggio · Notte · Riposo</small></div><div class="ct-metrics">${[['7','Notti'],['5','Riposi'],['1','Giorno di ferie'],['3','Smonti notte']].map(([value,label])=>`<div class="ct-metric"><strong>${value}</strong><small>${label}</small></div>`).join('')}</div><div class="ct-legend">Reperibilità · 7<span>Trasferte · 0</span></div>`;}
  const settingsItems=[['cloud-upload','Account e backup','Google Drive'],['scan-text','Importazione turni','Prospetto, screenshot o PDF'],['file-text','Esportazione PDF','Prospetto e stampa'],['calendar-sync','Google Calendar','Sincronizzazione'],['alarm-clock','Sveglie intelligenti','Anticipo rispetto al turno'],['bell-ring','Reperibilità','Regole e giorni'],['calendar-heart','Festività','Nazionali, religiose e CCNL']];
  function settings(){return `<div class="ct-header"><h2>Impostazioni</h2></div><p>Calendario Turni</p><div class="ct-section-title">Dati e collegamenti</div><div class="ct-settings-list">${settingsItems.slice(0,4).map(([icon,title,sub])=>`<button type="button" class="ct-settings-row cursor-interaction" data-setting="${title}">${icons(icon)}<span>${title}<small>${sub}</small></span>${icons('chevron-right')}</button>`).join('')}</div><div class="ct-section-title">Il tuo calendario</div><div class="ct-settings-list">${settingsItems.slice(4).map(([icon,title,sub])=>`<button type="button" class="ct-settings-row cursor-interaction" data-setting="${title}">${icons(icon)}<span>${title}<small>${sub}</small></span>${icons('chevron-right')}</button>`).join('')}</div>`;}
  function models(){
    const rows=state.modelTab==='Turni'?Object.entries(definitions).slice(0,7).map(([code,def])=>`<div class="ct-model-row"><div class="ct-badge" style="--shift:var(--ct-${def.color})">${code}</div><div><span class="ct-name">${def.name}</span><small>${def.range}${def.time==='TG'?'':' · 7 h 36 min'}</small></div></div>`).join(''):state.modelTab==='Lavori'?`<div class="ct-model-row"><div class="ct-badge">${icons('briefcase-business')}</div><div><span class="ct-name">Lavoro Principale</span><small>Profilo attivo · configurazione CCNL</small></div></div><div class="ct-field">Ore, pause e riposo minimo</div><div class="ct-field">Profili semplici e avanzati</div>`:`<div class="ct-model-row"><div class="ct-badge">${icons('repeat-2')}</div><div><span class="ct-name">Turno A</span><small>Rotazione predefinita</small></div></div><div class="ct-field">Sequenza e matrice settimanale</div><div class="ct-field">Applicazione: 30, 90, 180 o 365 giorni</div>`;
    return `<div class="ct-back-head">${iconButton('back-calendar','Torna al calendario','arrow-left')}<h2>Modelli e turni</h2></div><p>Orari, lavori e rotazioni</p><div class="ct-tabs">${['Turni','Lavori','Rotazioni'].map(t=>`<button type="button" data-model="${t}" aria-pressed="${state.modelTab===t}">${t}</button>`).join('')}</div><div class="ct-model-list">${rows}</div>`;
  }
  function shiftRow(code,index){const def=definitions[code];return `<div class="ct-shift-row"><div class="ct-shift-info"><div class="ct-badge" style="--shift:var(--ct-${def.color})">${code}</div><div><div class="ct-shift-title">${def.name}</div><div class="ct-shift-meta">${def.range}${def.time==='TG'?'':' · 7 h 36 min'}</div></div></div><div class="ct-shift-tools"><button type="button" class="ct-tool cursor-interaction" data-action="details" aria-label="Straordinario, stacco e note turno">${icons('sliders-horizontal')}</button><button type="button" class="ct-tool cursor-interaction" data-action="travel" aria-label="Trasferta" aria-pressed="${state.travel}">${icons('plane')}${state.travel?'<small>Attiva</small>':''}</button><button type="button" class="ct-tool ct-danger cursor-interaction" data-action="delete-preview" aria-label="Elimina turno">${icons('trash-2')}</button></div></div>`;}
  function daySheet(){return `<section class="ct-sheet" aria-label="Dettaglio giorno"><div class="ct-sheet-head">${iconButton('day-prev','Giorno precedente','chevron-left')}<h3>${dateLabel()}</h3>${iconButton('day-next','Giorno successivo','chevron-right')}${iconButton('close-sheet','Chiudi dettaglio','x')}</div><div class="ct-ccnl"><span>Riposo contrattuale CCNL</span><span>${icons('circle-check')}Conforme</span></div>${shiftRow(shiftFor(state.day),0)}${state.day===15?shiftRow('NOT',1):''}<button type="button" class="ct-info-row cursor-interaction" data-action="oncall" aria-pressed="${state.onCall}">${icons('bell-ring')}Reperibilità<span>${state.onCall?'Attiva':'Non attiva'}</span></button><button type="button" class="ct-info-row cursor-interaction" data-action="notes">${icons('notebook-pen')}<span style="margin-left:0;color:var(--ct-text);font-size:12px">${state.note?escape(state.note):'Note e tag del giorno'}</span>${icons('plus')}</button><div class="ct-footer"><button type="button" class="ct-button ct-primary cursor-interaction" data-action="replace">${icons('arrow-left-right')}Cambia turno</button><button type="button" class="ct-button cursor-interaction" data-action="add">${icons('circle-plus')}Altro turno</button></div></section>`;}
  function paintSheet(){return `<section class="ct-sheet ct-paint" aria-label="Modalità modifica calendario"><div class="ct-sheet-head"><h3>Modifica calendario</h3><button type="button" class="ct-button cursor-interaction" data-action="finish-paint">${icons('check')}Fatto</button></div><div class="ct-tabs">${['Cambia','Più turni','Periodo','Rotazione'].map(t=>`<button type="button" data-mode="${t}" aria-pressed="${state.mode===t}">${t}</button>`).join('')}</div><div class="ct-palette">${Object.entries(definitions).map(([code,def])=>`<button type="button" data-paint="${code}" aria-pressed="${state.paint===code}" aria-label="Seleziona ${def.name}"><span class="ct-chip" style="--shift:var(--ct-${def.color})">${code}</span></button>`).join('')}<button type="button" data-action="new-model">${icons('plus')}Nuovo</button><button type="button" data-paint="erase" aria-pressed="${state.paint==='erase'}">${icons('eraser')}Gomma</button></div></section>`;}
  function detailsSheet(){return `<section class="ct-sheet ct-detail" aria-label="Informazioni turno"><div class="ct-back-head">${iconButton('back-day','Torna al dettaglio giorno','arrow-left')}<h3>Info turno · ${definitions[shiftFor(state.day)].name}</h3></div><div class="ct-tabs"><button type="button" aria-pressed="true">Straordinario</button><button type="button" data-action="notes">Note turno</button></div><label class="ct-field">Stacco effettivo<input type="time" value="05:36" aria-label="Orario effettivo di stacco"></label><label class="ct-field">Straordinario<input type="number" min="0" step="0.25" value="${state.overtime}" aria-label="Ore di straordinario"></label><div class="ct-preset">${[15,30,45,60].map(m=>`<button type="button" data-overtime="${m}">+${m} min</button>`).join('')}</div><div class="ct-footer"><button type="button" class="ct-button ct-primary" data-action="save-details">Salva informazioni</button></div></section>`;}
  function notesSheet(){return `<section class="ct-sheet ct-detail" aria-label="Note del giorno"><div class="ct-back-head">${iconButton('back-day','Torna al dettaglio giorno','arrow-left')}<h3>Note e tag</h3></div><textarea aria-label="Nota del giorno" placeholder="Formazione, condotta, visite…">${escape(state.note)}</textarea><div class="ct-footer"><button type="button" class="ct-button ct-primary" data-action="save-notes">Salva nota</button></div></section>`;}
  function selector(){return `<section class="ct-sheet ct-detail" aria-label="Selettore turno"><div class="ct-back-head">${iconButton('back-day','Torna al dettaglio giorno','arrow-left')}<h3>${state.sheet==='add'?'Aggiungi':'Cambia'} turno · ${state.day}/${state.month+1}</h3></div><div class="ct-tabs"><button type="button" data-action="replace" aria-pressed="${state.sheet==='replace'}">Sostituisci</button><button type="button" data-action="add" aria-pressed="${state.sheet==='add'}">+ Aggiungi turno</button></div><div class="ct-settings-list">${Object.entries(definitions).slice(0,7).map(([code,def])=>`<button type="button" class="ct-settings-row" data-select-shift="${code}"><span class="ct-badge" style="--shift:var(--ct-${def.color});flex:0 0 39px">${code}</span><span>${def.name}<small>${def.range}</small></span></button>`).join('')}</div></section>`;}
  function render(){
    phone.dataset.appearance=design.dark?'dark':'light';
    content.innerHTML=state.tab==='calendar'?calendar():state.tab==='settings'?settings():state.tab==='report'?report():models();
    layer.innerHTML=state.sheet==='day'?daySheet():state.sheet==='paint'?paintSheet():state.sheet==='details'?detailsSheet():state.sheet==='notes'?notesSheet():['replace','add'].includes(state.sheet)?selector():'';
    updateDock();refreshIcons();
  }
  function notify(message){const el=root.querySelector('.ct-notice');el.textContent=message;el.classList.add('ct-visible');clearTimeout(notificationTimer);notificationTimer=setTimeout(()=>el.classList.remove('ct-visible'),2000);}
  function goTab(tab){state.tab=tab;state.sheet=null;render();persist();}
  function openDay(day){state.day=day;state.sheet='day';render();persist();}
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||button.disabled) return;
    const key=button.dataset.dock;
    if(key){if(key==='edit'){state.sheet='paint';render();}else goTab(key);return;}
    if(button.dataset.day){const day=+button.dataset.day;if(state.sheet==='paint'){notify(state.mode==='Periodo'?'Periodo: selezione del giorno '+day:state.mode==='Rotazione'?'Rotazione: inizio dal giorno '+day:'Anteprima modifica del giorno '+day);return;}openDay(day);return;}
    if(button.dataset.mode){state.mode=button.dataset.mode;render();return;}
    if(button.dataset.paint){state.paint=button.dataset.paint;render();return;}
    if(button.dataset.model){state.modelTab=button.dataset.model;render();return;}
    if(button.dataset.report){state.reportTab=button.dataset.report;render();if(state.reportTab!=='Mese')notify('Anteprima del selettore · dati di ottobre');return;}
    if(button.dataset.setting){notify(button.dataset.setting);return;}
    if(button.dataset.overtime){state.overtime=+(state.overtime+(+button.dataset.overtime)/60).toFixed(2);render();return;}
    if(button.dataset.selectShift){notify('Anteprima selettore · nessuna modifica ai turni');state.sheet='day';render();return;}
    switch(button.dataset.action){
      case 'today':state.year=2026;state.month=9;state.sheet=null;render();break;
      case 'month-prev':case 'month-next':{const d=new Date(state.year,state.month+(button.dataset.action==='month-next'?1:-1),1);state.year=d.getFullYear();state.month=d.getMonth();state.sheet=null;render();break;}
      case 'day-prev':case 'day-next':{const d=new Date(state.year,state.month,state.day+(button.dataset.action==='day-next'?1:-1));state.day=d.getDate();state.year=d.getFullYear();state.month=d.getMonth();render();break;}
      case 'close-sheet':state.sheet=null;render();break;
      case 'back-calendar':goTab('calendar');break;
      case 'details':state.sheet='details';render();break;
      case 'notes':state.sheet='notes';render();break;
      case 'back-day':state.sheet='day';render();break;
      case 'oncall':state.onCall=!state.onCall;render();break;
      case 'travel':state.travel=!state.travel;render();break;
      case 'delete-preview':notify('Anteprima · eliminazione non eseguita');break;
      case 'replace':case 'add':state.sheet=button.dataset.action;render();break;
      case 'finish-paint':state.sheet=null;render();break;
      case 'save-notes':state.note=layer.querySelector('textarea').value;state.sheet='day';render();notify('Nota aggiornata nella sola anteprima');break;
      case 'save-details':state.overtime=+layer.querySelector('input[type="number"]').value;state.sheet='day';render();notify('Anteprima informazioni turno');break;
      case 'new-model':notify('Nuovo modello turno');break;
      case 'report-prev':case 'report-next':notify('Anteprima del selettore periodo');break;
    }
    persist();
  });
  root.addEventListener('keydown',event=>{if(event.key==='Escape'){state.sheet=null;render();}});
  new ResizeObserver(drawDock).observe(dock);
  reduced.addEventListener?.('change',()=>updateDock());
  window.addEventListener('openai:set_globals',event=>{const restored=event.detail?.globals?.widgetState?.privateContent;if(typeof restored?.dark==='boolean'){design.dark=restored.dark;render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{render();persist();}});tweak.addToggle(design,'dark',{label:'Tema scuro'});tweak.addSlider(design,'speed',{label:'Velocità delle gocce',min:.45,max:1.5,step:.05});}
})();
</script>
